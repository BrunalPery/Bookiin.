    </g>

    <!-- Debossed Warm Gold Dot "." -->
    <g filter="url(#dotDeboss)">
      <circle cx="410" cy="279" r="7.5" fill="url(#goldDotGrad)" />
      <!-- Subtle inner reflection on dot -->
      <circle cx="408.5" cy="277.5" r="3.375" fill="#FFF4D6" fill-opacity="0.45" />
    </g>
  </g>
</svg>